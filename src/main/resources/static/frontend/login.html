<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekran Logowania</title>
    <style>
        /* ustawienia wstępne */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f0f0;
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        /* główna część */
        .main-content {
            flex: 1;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }

        /* login */
        .login-box {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-box h2 {
            margin-bottom: 10px;
            font-size: 28px;
            color: #333;
        }

        /* tekstowe */
        .input-field {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            border-radius: 4px; /* Minimalne zaokrąglenie */
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #888;
            background-color: #fff;
        }

        /* Przycisk */
        .btn-login {
            background: linear-gradient(to bottom, #a8a8a8, #e0e0e0);
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: black;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            margin-top: 10px;
            
            transition: transform 0.2s ease;
        }

        .btn-login:hover {
            transform: scale(1.1);
        }

        /* Sidebar*/
        .sidebar {
            width: 350px;
            background: linear-gradient(to right, #bfbfbf, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 100px;
            box-shadow: inset 15px 0 20px -10px rgba(0,0,0,0.15);
        }

        .logo {
            width: 100px;
            height: 100px;
            background-color: black;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 120px;
        }

        .logo span {
            color: white;
            font-size: 20px;
            font-style: italic;
            transform: rotate(-30deg);
        }

        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .menu a {
            text-decoration: none;
            color: black;
            font-size: 20px;
            font-weight: 400;
            transition: transform 0.2s;
        }

        .menu a:hover {
            transform: scale(1.1); 
        }
    </style>
</head>
<body>

    <div class="container">
        <main class="main-content">
            <div class="login-box">
                <h2>Panel Logowania</h2>
                
                <input type="text" class="input-field" placeholder="Login / E-mail">
                <input type="password" class="input-field" placeholder="Hasło">
                
                <button class="btn-login">ZALOGUJ SIĘ</button>
            </div>
        </main>

        <aside class="sidebar">
            <div class="logo">
                <span>logo</span>
            </div>

            <nav class="menu">
                <a href="#">Pomoc</a>
                <a href="#">Kontakt</a>
                <a href="#">O systemie</a>
            </nav>
        </aside>
    </div>

</body>
</html>
