<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazyny szpitala</title>
    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-sidebar: #2aa6a1;
            --bg-sidebar-light: #5fd1c7;
            --accent: #1a8f88;
            --accent-dark: #11645f;
            --text-main: #133236;
            --text-muted: #6c7a7a;
            --card-border: #d5e4e6;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                        Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;          /* CAŁE TŁO BIAŁE */
            color: var(--text-main);
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        .main-content {
            flex: 1;
            padding: 24px 32px;
            overflow-y: auto;
            background: #ffffff;         /* BIAŁE, BEZ PRZEZROCZYSTOŚCI */
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, var(--bg-sidebar), var(--bg-sidebar-light));
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.15);
            color: #ffffff;
        }

        .logo {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .logo span {
            color: #ffffff;
            font-size: 18px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
            width: 80%;
        }

        .menu a {
            text-decoration: none;
            color: #e8f9f8;
            font-size: 15px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            padding-bottom: 4px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s, transform 0.15s, color 0.15s;
        }

        .menu a:hover {
            border-color: rgba(255, 255, 255, 0.7);
            transform: translateX(3px);
            color: #ffffff;
        }

        h1 {
            margin-bottom: 4px;
            font-size: 28px;
            letter-spacing: 0.03em;
        }

        h2 {
            margin: 20px 0 10px;
            font-size: 20px;
        }

        .message {
            margin: 8px 0 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .message.error {
            color: #c0392b;
        }

        .stocks {
            margin-bottom: 24px;
        }

        .btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            margin: 4px 6px 0 0;
            font-size: 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
        }

        .btn:focus {
            outline: 2px solid rgba(17, 100, 95, 0.4);
            outline-offset: 2px;
        }

        .section-title {
            font-size: 18px;
            margin: 10px 0 4px;
        }

        .products-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 14px;
        }

        .product-card {
            width: 260px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
            background-color: #ffffff;  
            display: flex;
            flex-direction: column;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: contain;       
            background: #ffffff; 
            padding: 8px;
        }

        .product-content {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .product-name {
            font-weight: 600;
            font-size: 15px;
        }

        .product-type {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .product-meta {
            margin-top: 8px;
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            align-items: baseline;
        }

        .product-meta span {
            white-space: nowrap;
        }

        .product-price {
            font-weight: 600;
            color: var(--accent-dark);
        }

        .product-available {
            color: #1b9c6b;
            font-weight: 500;
        }

        .product-not-available {
            color: #c0392b;
            font-weight: 500;
        }

        .product-use-btn {
            margin-top: 10px;
            align-self: flex-start;
        }
    </style>


</head>
<body>

<div class="container">
    <main class="main-content">
        <h1>Magazyny szpitala</h1>
        <div id="info" class="message"></div>

        <h2>Wybierz magazyn</h2>
        <div id="stocks-container" class="stocks"></div>

        <h2>Produkty w wybranym magazynie</h2>
        <div id="products-container"></div>
    </main>

    <aside class="sidebar">
        <div class="logo">
            <span>logo</span>
        </div>

        <nav class="menu">
            <a href="#">Pomoc</a>
            <a href="#">Kontakt</a>
            <a href="#">O systemie</a>
        </nav>
    </aside>
</div>

<script>
    // ===== KONFIGURACJA =====
    const BACKEND_URL = "http://localhost:8080";
    const HOSPITAL_ID = 1; // na razie na sztywno, możesz zmienić

    function showMessage(text, isError = false) {
        const el = document.getElementById("info");
        el.textContent = text;
        el.className = isError ? "message error" : "message";
    }

    // ===== STOCKS =====

    async function loadStocks() {
        const url = `${BACKEND_URL}/api/stocks?hospitalId=${encodeURIComponent(HOSPITAL_ID)}`;

        try {
            const res = await fetch(url);
            if (!res.ok) {
                throw new Error("HTTP " + res.status);
            }
            const stocks = await res.json();
            renderStocks(stocks);
            if (!stocks || stocks.length === 0) {
                showMessage("Brak magazynów dla tego szpitala.");
            } else {
                showMessage(`Załadowano ${stocks.length} magazyn(y) dla szpitala ID ${HOSPITAL_ID}.`);
                // opcjonalnie od razu załaduj pierwszy magazyn
                loadProductsForStock(stocks[0].id, `${stocks[0].name} (${stocks[0].category})`);
            }
        } catch (err) {
            console.error(err);
            showMessage("Nie udało się pobrać magazynów.", true);
        }
    }

    function renderStocks(stocks) {
        const container = document.getElementById("stocks-container");
        container.innerHTML = "";

        if (!stocks || stocks.length === 0) {
            container.innerHTML = "<p>Brak magazynów.</p>";
            return;
        }

        stocks.forEach(stock => {
            const btn = document.createElement("button");
            btn.className = "btn";
            const label = `${stock.name} (${stock.category})`;
            btn.textContent = label;
            btn.onclick = () => loadProductsForStock(stock.id, label);
            container.appendChild(btn);
        });
    }

    // ===== PRODUCTS =====

    async function loadProductsForStock(stockId, stockLabel) {
        const container = document.getElementById("products-container");
        container.innerHTML = `<p class="message">Ładowanie produktów dla magazynu: <strong>${stockLabel}</strong>...</p>`;

        const url = `${BACKEND_URL}/api/products/stock/${encodeURIComponent(stockId)}`;

        try {
            const res = await fetch(url);
            if (!res.ok) {
                throw new Error("HTTP " + res.status);
            }
            const products = await res.json();
            renderProducts(products, stockLabel);
        } catch (err) {
            console.error(err);
            container.innerHTML = `<p class="message error">Nie udało się pobrać produktów dla magazynu: <strong>${stockLabel}</strong></p>`;
        }
    }

    function renderProducts(products, stockLabel) {
        const container = document.getElementById("products-container");
        container.innerHTML = "";

        if (!products || products.length === 0) {
            container.innerHTML = `<p class="message">Brak produktów w magazynie: <strong>${stockLabel}</strong></p>`;
            return;
        }

        const title = document.createElement("div");
        title.className = "section-title";
        title.innerHTML = `Magazyn: <strong>${stockLabel}</strong>`;
        container.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "products-grid";

        products.forEach(p => {
            const card = document.createElement("div");
            card.className = "product-card";

            if (p.mediaUrl) {
                const img = document.createElement("img");
                img.src = "." + p.mediaUrl;
                img.alt = p.name;
                card.appendChild(img);
            }

            const content = document.createElement("div");
            content.className = "product-content";

            const nameEl = document.createElement("div");
            nameEl.className = "product-name";
            nameEl.textContent = p.name;
            content.appendChild(nameEl);

            const typeEl = document.createElement("div");
            typeEl.className = "product-type";
            typeEl.textContent = p.type;
            content.appendChild(typeEl);

            const meta = document.createElement("div");
            meta.className = "product-meta";

            const qtyEl = document.createElement("span");
            qtyEl.textContent = `Ilość: ${p.quantity}`;
            meta.appendChild(qtyEl);

            const priceEl = document.createElement("span");
            priceEl.className = "product-price";
            priceEl.textContent = `${p.cost} PLN`;
            meta.appendChild(priceEl);

            const availEl = document.createElement("span");
            availEl.textContent = p.available ? "Dostępny" : "Niedostępny";
            availEl.className = p.available ? "product-available" : "product-not-available";
            meta.appendChild(availEl);

            content.appendChild(meta);

            // ===== PRZYCISK "USE" =====
            const useBtn = document.createElement("button");
            useBtn.className = "btn product-use-btn";
            useBtn.textContent = "Use";
            useBtn.onclick = () => {
                // tutaj dodaj logikę "użycia" produktu:
                // np. otwarcie formularza, wywołanie backendu itp.
                console.log("Use clicked for product:", p);
                alert(`Use: ${p.name}`);
            };

            content.appendChild(useBtn);
            // ============================

            card.appendChild(content);
            grid.appendChild(card);
        });

        container.appendChild(grid);
    }

    // ===== START =====
    document.addEventListener("DOMContentLoaded", () => {
        loadStocks();
    });
</script>

</body>
</html>
