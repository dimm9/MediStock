<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStock - Magazyny szpitala</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            background-color: #f0f7ff; 
            color: #334e68;
        }

        .container { 
            display: flex; 
            height: 100%; 
            width: 100%; 
        }
        
        .main-content { 
            flex: 1; 
            background-color: white; 
            display: flex; 
            flex-direction: column;
            padding: 30px; 
            position: relative;
            z-index: 10;
            box-shadow: 10px 0 40px rgba(0, 119, 230, 0.08);
            border-top-right-radius: 30px;
            border-bottom-right-radius: 30px;
            overflow-y: auto;
        }

        .main-content::-webkit-scrollbar {
            width: 8px;
        }
        .main-content::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .main-content::-webkit-scrollbar-thumb {
            background: #bcccdc; 
            border-radius: 4px;
        }
        .main-content::-webkit-scrollbar-thumb:hover {
            background: #829ab1; 
        }

        h1 { 
            font-size: 32px; 
            color: #102a43; 
            font-weight: 800; 
            margin-bottom: 20px; 
            letter-spacing: -0.5px;
        }

        h2 { 
            font-size: 20px; 
            color: #334e68; 
            margin: 25px 0 15px; 
            font-weight: 600; 
            border-bottom: 2px solid #f0f7ff;
            padding-bottom: 10px;
            display: inline-block;
        }

        .message { 
            padding: 15px; 
            border-radius: 12px; 
            background-color: #f0f7ff; 
            color: #334e68; 
            margin-bottom: 20px; 
            border: 1px solid #dae1e7;
            font-size: 14px;
            display: none; /* Domyślnie ukryte */
        }
        
        .message.error { 
            background-color: #ffeef0; 
            color: #d64545; 
            border-color: #f7c5c5;
            display: block;
        }
        
        .message.success {
            background-color: #e6fffa;
            color: #234e52;
            border-color: #b2f5ea;
            display: block;
        }

        .stocks { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
            margin-bottom: 10px; 
        }

        .btn {
            background: linear-gradient(135deg, #3fa9f5 0%, #0077e6 100%); 
            border: none; 
            padding: 12px 24px; 
            font-size: 14px; 
            font-weight: 700; 
            color: white; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0, 119, 230, 0.2); 
            border-radius: 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            letter-spacing: 0.5px;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(0, 119, 230, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(63, 169, 245, 0.4);
        }

        .products-grid { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            margin-top: 10px; 
            padding-bottom: 30px;
        }

        .product-card {
            width: 260px;
            background: white;
            border: 1px solid #dae1e7;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .product-card:hover {
            border-color: #3fa9f5;
            box-shadow: 0 15px 35px -10px rgba(0, 119, 230, 0.2);
            transform: translateY(-4px);
        }

        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            padding: 20px;
            background: #f8fafc;
            border-bottom: 1px solid #dae1e7;
        }

        .product-content { 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            flex: 1;
        }

        .product-name { 
            font-weight: 700; 
            color: #102a43; 
            font-size: 16px; 
            line-height: 1.4;
        }

        .product-type { 
            font-size: 11px; 
            color: #829ab1; 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 0.5px; 
        }

        .product-meta { 
            margin-top: 12px; 
            font-size: 13px; 
            color: #486581; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px 12px; 
            align-items: baseline; 
            justify-content: space-between;
        }

        .product-price { 
            font-weight: 800; 
            color: #102a43; 
            font-size: 15px; 
        }

        .product-available { 
            color: #234e52; 
            font-weight: 700; 
            font-size: 12px;
            padding: 4px 10px;
            background: #e6fffa;
            border-radius: 20px;
        }

        .product-not-available { 
            color: #822025; 
            font-weight: 700; 
            font-size: 12px;
            padding: 4px 10px;
            background: #ffe3e3;
            border-radius: 20px;
        }

        .product-use-btn {
            margin-top: auto;
            padding: 10px 16px;
            font-size: 13px;
            width: 100%;
            text-align: center;
            background: white;
            color: #3fa9f5;
            border: 2px solid #3fa9f5;
            box-shadow: none;
            text-transform: uppercase;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .product-use-btn:hover {
            background: #3fa9f5;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(63, 169, 245, 0.3);
        }

        .sidebar { 
            width: 200px;
            background: linear-gradient(160deg, #e3f2fd 0%, #bbdefb 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            padding: 30px 10px; 
            position: relative;
            flex-shrink: 0;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: transparent;
            box-shadow: none;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            margin-top: 20px;
            transform: rotate(-5deg);
            transition: transform 0.5s ease;
        }

        .logo span { display: none; }

        .logo:hover {
            transform: rotate(0deg) scale(1.05);
        }

        
        .menu { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
            width: 100%;
        }
        
        .menu a { 
            text-decoration: none; 
            color: #486581; 
            font-size: 14px; 
            font-weight: 600; 
            transition: all 0.3s; 
            padding: 10px 0;
            width: 80%;
            text-align: center;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }
        
        .menu a:hover { 
            color: #0077e6; 
            background-color: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(16, 42, 67, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 400px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.open .modal {
            transform: scale(1);
        }

        .modal h3 {
            margin-bottom: 10px;
            font-size: 20px;
            color: #102a43;
        }

        .modal p {
            color: #486581;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #dae1e7;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 25px;
            outline: none;
            color: #102a43;
            font-weight: 700;
        }

        .modal-input:focus {
            border-color: #3fa9f5;
            box-shadow: 0 0 0 3px rgba(63, 169, 245, 0.2);
        }

        .modal-actions {
            display: flex;
            gap: 15px;
        }

        .modal-actions button {
            flex: 1;
        }

        .btn-secondary {
            background: white;
            color: #486581;
            border: 2px solid #dae1e7;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: #f0f7ff;
            color: #102a43;
            border-color: #bcccdc;
            transform: translateY(-2px);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { margin: 0; }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .header-actions { display: flex; gap: 10px; }

        .btn {
            background: linear-gradient(135deg, #3fa9f5 0%, #0077e6 100%);
            border: none; padding: 12px 24px; font-size: 14px; font-weight: 700;
            color: white; cursor: pointer; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 119, 230, 0.2);
            transition: all 0.2s; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 119, 230, 0.3); }

        .btn.secondary { background: white; color: #3fa9f5; border: 2px solid #3fa9f5; box-shadow: none; }
        .btn.secondary:hover { background: #3fa9f5; color: white; }
        .btn.active-tab { background: #3fa9f5; color: white; border-color: #3fa9f5; }

        table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            overflow: hidden; border-radius: 16px; border: 1px solid #dae1e7;
            background: white; margin-top: 15px;
        }
        thead th {
            text-align: left; padding: 15px; background: #f8fafc;
            color: #334e68; font-size: 13px; text-transform: uppercase;
            letter-spacing: 0.4px; border-bottom: 1px solid #dae1e7;
        }
        tbody td {
            padding: 15px; border-bottom: 1px solid #dae1e7;
            font-size: 14px; color: #334e68; vertical-align: middle;
        }
        tbody tr:last-child td { border-bottom: none; }

        .hidden { display: none !important; }
        .mini-badge {
            padding: 5px 10px; border-radius: 6px; font-size: 11px;
            font-weight: 800; text-transform: uppercase;
            background: #e3f2fd; color: #102a43;
        }

        @media (max-width: 850px) {
            .container { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: auto; padding: 10px; flex-direction: row; justify-content: space-between; align-items: center;}
            .logo { width: 50px; height: 50px; margin: 0; }
            .logo span { font-size: 10px; }
            .menu { flex-direction: row; gap: 5px; width: auto; }
            .menu a { padding: 5px 10px; font-size: 12px; width: auto; }
            .main-content { border-radius: 0; padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <main class="main-content">
        <div class="header-row">
            <h1>Panel Pracownika</h1>
            <div class="header-actions">
                <button id="btnStocks" class="btn secondary active-tab" onclick="switchView('stocks')">Magazyny</button>
                <button id="btnHistory" class="btn secondary" onclick="switchView('history')">Historia</button>
            </div>
        </div>
        <div id="info" class="message"></div>
        <section id="stockSection">
            <h2>Wybierz magazyn</h2>
            <div id="stocks-container" class="stocks"></div>
            <div id="products-container"></div>
        </section>
        <section id="historySection" class="hidden">
            <h2>Dziennik operacji</h2>
            <button class="btn" style="padding: 10px 20px;" onclick="loadHistory()">Odśwież listę</button>
            <div id="historyTableContainer"></div>
        </section>
    </main>

    <aside class="sidebar">
        <div class="logo">
            <img src="http://localhost:8080/images/logo.png" alt="Logo" style="width: 70px; height: 70px; object-fit: contain;">
        </div>

        <nav class="menu" id="sidebarMenu">
            <!-- Menu items will be injected here -->
        </nav>
    </aside>
</div>

<div id="useModal" class="modal-overlay">
    <div class="modal">
        <h3 id="modalTitle">Pobierz produkt</h3>
        <p id="modalMessage">Ile sztuk chcesz pobrać?</p>

        <input type="number" id="modalInput" class="modal-input" min="1" value="1" />

        <div class="modal-actions">
            <button id="btnCancel" class="btn btn-secondary">Anuluj</button>
            <button id="btnConfirm" class="btn">Pobierz</button>
        </div>
    </div>
</div>

<script>
    // ===== DEMO dla braku połączenia =====
    const BACKEND_URL = "http://localhost:8080";
    const token = localStorage.getItem('jwt_token');
    if (!token) {
        // brak tokenu => wracamy na login
        window.location.href = "login.html";
    }

    const role = String(localStorage.getItem('role') || localStorage.getItem('user_role') || "")
        .trim()
        .toUpperCase();

    if (role === "ADMIN" || role === "ADMINISTRATOR") {
        // window.location.href = "admin.html";
    }
    const HOSPITAL_ID = Number(localStorage.getItem('hospital_id'));
    if (!HOSPITAL_ID) {
        showMessage("Brak przypisanego szpitala do konta.", "error");
        localStorage.clear();
        window.location.href = "login.html";
    }

    const MOCK_STOCKS = [
        { id: 101, name: "Magazyn Centralny" },
        { id: 102, name: "Apteka Oddziałowa" },
        { id: 103, name: "Magazyn Sprzętu" }
    ];

    const MOCK_PRODUCTS = {
        101: [
            { id: 1, name: "Rękawiczki nitrylowe M", type: "Zużywalne", quantity: 5000, cost: 25.00, available: true, mediaUrl: null },
            { id: 2, name: "Maseczki chirurgiczne", type: "Zużywalne", quantity: 2000, cost: 15.00, available: true, mediaUrl: null },
            { id: 3, name: "Środek dezynfekujący", type: "Chemia", quantity: 50, cost: 120.00, available: true, mediaUrl: null }
        ],
        102: [
            { id: 4, name: "Paracetamol 500mg", type: "Lek", quantity: 200, cost: 5.50, available: true, mediaUrl: null },
            { id: 5, name: "Ibuprofen 400mg", type: "Lek", quantity: 150, cost: 6.20, available: true, mediaUrl: null },
            { id: 6, name: "Antybiotyk X", type: "Lek", quantity: 0, cost: 45.00, available: false, mediaUrl: null }
        ],
        103: [
            { id: 7, name: "Strzykawka 2ml", type: "Sprzęt", quantity: 1000, cost: 0.20, available: true, mediaUrl: null },
            { id: 8, name: "Stetoskop", type: "Sprzęt", quantity: 5, cost: 250.00, available: true, mediaUrl: null }
        ]
    };

    function showMessage(text, type = 'normal') {
        const el = document.getElementById("info");
        el.textContent = text;
        if(type === 'error') el.className = "message error";
        else if(type === 'success') el.className = "message success";
        else el.className = "message";
        el.style.display = text ? "block" : "none";
    }
    // opóźnienie demo
    const delay = ms => new Promise(res => setTimeout(res, ms));

    // ===== STOCKS =====
    // ===== PRZEŁĄCZANIE WIDOKÓW =====
    function switchView(viewName) {
        const stockSec = document.getElementById('stockSection');
        const histSec = document.getElementById('historySection');
        const btnStocks = document.getElementById('btnStocks');
        const btnHistory = document.getElementById('btnHistory');
        if (viewName === 'stocks') {
            stockSec.classList.remove('hidden');
            histSec.classList.add('hidden');
            btnStocks.classList.add('active-tab');
            btnHistory.classList.remove('active-tab');
        } else {
            stockSec.classList.add('hidden');
            histSec.classList.remove('hidden');
            btnStocks.classList.remove('active-tab');
            btnHistory.classList.add('active-tab');
            loadHistory();
        }
    }

    // ===== ŁADOWANIE HISTORII (STYL ADMINA + NAZWA PRODUKTU) =====
    async function loadHistory() {
        const wrap = document.getElementById("historyTableContainer");
        wrap.innerHTML = '<p class="message" style="display:block">Ładowanie...</p>';
        try {
            const res = await fetch(`${BACKEND_URL}/api/products/history/user`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error("Błąd pobierania");
            const history = await res.json();
            history.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            if (!history.length) {
                wrap.innerHTML = "<p class='message' style='display:block'>Brak wpisów w historii.</p>";
                return;
            }
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Typ</th>
                            <th>Opis operacji</th>
                            <th>Szczegóły</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            history.forEach(h => {
                const dateStr = new Date(h.timestamp).toLocaleString();
                const desc = h.description && h.description.trim() !== ""
                    ? h.description
                    : "Użycie produktu (brak nazwy)";

                html += `
                    <tr>
                        <td>${dateStr}</td>
                        <td><span class="mini-badge">UZYCIE</span></td>
                        <td style="font-weight: 500; color: #102a43;">${escapeHtml(desc)}</td>
                        <td><strong>${h.amount} szt.</strong></td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            wrap.innerHTML = html;
        } catch (e) {
            console.error(e);
            wrap.innerHTML = '<p class="message error">Nie udało się pobrać historii.</p>';
        }
    }

    function escapeHtml(text) {
        if (!text) return "";
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

    async function loadStocks() {
        let url;
        const role = String(localStorage.getItem('role') || localStorage.getItem('user_role') || "").trim().toUpperCase();

        if (role === "ADMIN" || role === "ADMINISTRATOR") {
            // Admin sees all stocks
            url = `${BACKEND_URL}/api/stock/all`;
        } else {
            // Regular user sees only their hospital's stocks
            url = `${BACKEND_URL}/api/stocks?hospitalId=${encodeURIComponent(HOSPITAL_ID)}`;
        }

        try {
            // Próba pobrania z API
            const res = await fetch(url, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!res.ok) throw new Error("HTTP " + res.status);
            const stocks = await res.json();
            renderStocks(stocks);
            if (stocks && stocks.length > 0) {
                 loadProductsForStock(stocks[0].id, `${stocks[0].name}`);
            }
        } catch (err) {
            console.warn("Brak połączenia z backendem. Uruchamiam Tryb Demo.", err);
            // zmiana na demo
            await delay(300); // opóźnienie w demo
            renderStocks(MOCK_STOCKS);
            showMessage("Tryb Demo: Brak połączenia z serwerem. Wyświetanie danych przykładowych.", "success");

            if (MOCK_STOCKS.length > 0) {
                loadProductsForStock(MOCK_STOCKS[0].id, `${MOCK_STOCKS[0].name}`);
            }
        }
    }

    function renderStocks(stocks) {
        const container = document.getElementById("stocks-container");
        container.innerHTML = "";
        if (!stocks || stocks.length === 0) {
            container.innerHTML = "<p>Brak magazynów.</p>";
            return;
        }
        stocks.forEach(stock => {
            const btn = document.createElement("button");
            btn.className = "btn";
            const label = `${stock.name}`;
            btn.textContent = label;
            btn.onclick = () => loadProductsForStock(stock.id, label);
            container.appendChild(btn);
        });
    }

    // ===== PRODUCTS =====

    async function loadProductsForStock(stockId, stockLabel) {
        currentStockId = stockId;
        currentStockLabel = stockLabel;
        const container = document.getElementById("products-container");
        container.innerHTML = `<p class="message" style="display:block">Ładowanie produktów dla magazynu: <strong>${stockLabel}</strong>...</p>`;

        const url = `${BACKEND_URL}/api/products/stock/${encodeURIComponent(stockId)}`;

        try {
            const res = await fetch(url, {
                headers: { Authorization: `Bearer ${token}` }
            });

            if (res.status === 401 || res.status === 403) {
                localStorage.removeItem('jwt_token');
                window.location.href = "login.html";
                return;
            }

            if (!res.ok) throw new Error("HTTP " + res.status);

            const products = await res.json();
            renderProducts(products, stockLabel);
        } catch (err) {
            // zmiana na demo
            await delay(300);
            const mockProducts = MOCK_PRODUCTS[stockId] || [];
            renderProducts(mockProducts, stockLabel);
        }
    }

    async function useProduct(id, name, currentQty) {
        const amount = await showUseModal(name, currentQty);
        if (amount === null) return;
        try {
            const res = await fetch(`${BACKEND_URL}/api/products/use/${id}?amount=${amount}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            if (res.ok) {
                showMessage(`Pobrano ${amount} szt. "${name}".`, "success");
                loadProductsForStock(currentStockId, currentStockLabel);
            } else {
                console.error("Błąd", res.status);
                showMessage("Błąd podczas pobierania produktu.", "error");
            }
        } catch (err) {
            console.error(err);
            showMessage("Błąd połączenia.", "error");
        }
    }

    function showUseModal(productName, maxQty) {
        return new Promise((resolve) => {
            const overlay = document.getElementById('useModal');
            const title = document.getElementById('modalTitle');
            const message = document.getElementById('modalMessage');
            const input = document.getElementById('modalInput');
            const btnConfirm = document.getElementById('btnConfirm');
            const btnCancel = document.getElementById('btnCancel');

            title.textContent = `Pobierz: ${productName}`;
            message.textContent = `Dostępne na stanie: ${maxQty} szt.`;
            input.value = 1;
            input.max = maxQty;

            overlay.classList.add('open');
            input.focus();

            const close = (value) => {
                overlay.classList.remove('open');
                btnConfirm.onclick = null;
                btnCancel.onclick = null;
                input.onkeydown = null;
                resolve(value);
            };

            btnConfirm.onclick = () => {
                const val = parseInt(input.value);
                if (val && val > 0 && val <= maxQty) {
                    close(val);
                } else {
                    alert(`Podaj poprawną ilość (1 - ${maxQty})`);
                    input.focus();
                }
            };
            btnCancel.onclick = () => close(null);
            input.onkeydown = (e) => {
                if (e.key === "Enter") btnConfirm.click();
                if (e.key === "Escape") btnCancel.click();
            };
        });
    }

    function renderProducts(products, stockLabel) {
        const container = document.getElementById("products-container");
        container.innerHTML = "";

        const title = document.createElement("h2");
        title.innerHTML = `Produkty w magazynie: <span style="color: #3fa9f5">${stockLabel}</span>`;
        container.appendChild(title);

        if (!products || products.length === 0) {
            const msg = document.createElement("p");
            msg.className = "message";
            msg.style.display = "block";
            msg.textContent = "Brak produktów w tym magazynie.";
            container.appendChild(msg);
            return;
        }

        const grid = document.createElement("div");
        grid.className = "products-grid";

        products.forEach(p => {
            const card = document.createElement("div");
            card.className = "product-card";

            // obrazek / placeholder
            const img = document.createElement("img");
            if (p.mediaUrl) {
                img.src = BACKEND_URL + p.mediaUrl;
            } else {
                // generowanie placeholdera
                img.src = `https://placehold.co/260x160/f0f7ff/334e68?text=${encodeURIComponent(p.name)}`;
            }
            img.alt = p.name;
            card.appendChild(img);

            const content = document.createElement("div");
            content.className = "product-content";

            const nameEl = document.createElement("div");
            nameEl.className = "product-name";
            nameEl.textContent = p.name;
            content.appendChild(nameEl);

            const typeEl = document.createElement("div");
            typeEl.className = "product-type";
            typeEl.textContent = p.type;
            content.appendChild(typeEl);

            const meta = document.createElement("div");
            meta.className = "product-meta";

            const qtyEl = document.createElement("span");
            qtyEl.textContent = `Ilość: ${p.quantity}`;
            meta.appendChild(qtyEl);

            const priceEl = document.createElement("span");
            priceEl.className = "product-price";
            priceEl.textContent = `${p.cost} PLN`;
            meta.appendChild(priceEl);

            const availEl = document.createElement("span");
            availEl.textContent = p.available ? "Dostępny" : "Niedostępny";
            availEl.className = p.available ? "product-available" : "product-not-available";
            meta.appendChild(availEl);

            content.appendChild(meta);

            // ===== PRZYCISK "USE" =====
            const useBtn = document.createElement("button");
            useBtn.className = "product-use-btn";
            useBtn.textContent = "Użyj";

            if (p.quantity <= 0 || !p.available) {
                useBtn.style.opacity = "0.5";
                useBtn.disabled = true;
                useBtn.style.cursor = "not-allowed";
            } else {
                useBtn.onclick = () => useProduct(p.id, p.name, p.quantity);
            }

            content.appendChild(useBtn);

            card.appendChild(content);
            grid.appendChild(card);
        });

        container.appendChild(grid);
    }

    function renderSidebar() {
        const role = String(localStorage.getItem('role') || localStorage.getItem('user_role') || "").trim().toUpperCase();
        const menu = document.querySelector('.menu');
        menu.innerHTML = '';

        const isAdmin = (role === "ADMIN" || role === "ADMINISTRATOR");

        // Helper to create link
        const createLink = (href, text, isActive = false) => {
            const a = document.createElement('a');
            a.href = href;
            a.textContent = text;
            if (isActive) {
                a.style.backgroundColor = "rgba(255, 255, 255, 0.9)";
                a.style.color = "#0077e6";
                a.style.boxShadow = "0 4px 10px rgba(0,0,0,0.05)";
            }
            return a;
        };

        if (isAdmin) {
            menu.appendChild(createLink("admin.html", "Panel Admina"));
            menu.appendChild(createLink("depot.html", "Szpitale"));
        }

        menu.appendChild(createLink("stock.html", "Magazyn", true)); // Active
        menu.appendChild(createLink("account.html", "Konto"));
        menu.appendChild(createLink("settings.html", "Ustawienia"));

        const logoutLink = createLink("#", "Wyloguj");
        logoutLink.onclick = logout;
        menu.appendChild(logoutLink);
    }

    // ===== START =====
    document.addEventListener("DOMContentLoaded", () => {
        loadStocks();
        renderSidebar();
    });
</script>
