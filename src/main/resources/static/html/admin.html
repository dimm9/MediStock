<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStock - Panel administratora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f7ff;
            color: #334e68;
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        .main-content {
            flex: 1;
            background-color: white;
            display: flex;
            flex-direction: column;
            padding: 30px;
            position: relative;
            z-index: 10;
            box-shadow: 10px 0 40px rgba(0, 119, 230, 0.08);
            border-top-right-radius: 30px;
            border-bottom-right-radius: 30px;
            overflow-y: auto;
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: #f1f1f1; }
        .main-content::-webkit-scrollbar-thumb { background: #bcccdc; border-radius: 4px; }
        .main-content::-webkit-scrollbar-thumb:hover { background: #829ab1; }

        h1 {
            font-size: 32px;
            color: #102a43;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 20px;
            color: #334e68;
            margin: 25px 0 15px;
            font-weight: 600;
            border-bottom: 2px solid #f0f7ff;
            padding-bottom: 10px;
            display: inline-block;
        }

        .message {
            padding: 15px;
            border-radius: 12px;
            background-color: #f0f7ff;
            color: #334e68;
            margin-bottom: 20px;
            border: 1px solid #dae1e7;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background-color: #ffeef0;
            color: #d64545;
            border-color: #f7c5c5;
            display: block;
        }

        .message.success {
            background-color: #e6fffa;
            color: #234e52;
            border-color: #b2f5ea;
            display: block;
        }

        .btn {
            background: linear-gradient(135deg, #3fa9f5 0%, #0077e6 100%);
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 119, 230, 0.2);
            border-radius: 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 119, 230, 0.3);
        }

        .btn:active { transform: translateY(0); }

        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(63, 169, 245, 0.4);
        }

        .btn.secondary {
            background: white;
            color: #3fa9f5;
            border: 2px solid #3fa9f5;
            box-shadow: none;
        }
        .btn.secondary:hover { background: #3fa9f5; color: white; }

        .sidebar {
            width: 200px;
            background: linear-gradient(160deg, #e3f2fd 0%, #bbdefb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 10px;
            position: relative;
            flex-shrink: 0;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: transparent;
            box-shadow: none;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            margin-top: 20px;
            transform: rotate(-5deg);
            transition: transform 0.5s ease;
        }

        .logo span { display: none; }


        .logo:hover { transform: rotate(0deg) scale(1.05); }

        .logo span {
            background: linear-gradient(135deg, #3fa9f5 0%, #0077e6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 16px;
            font-weight: 900;
            font-style: italic;
        }

        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .menu a {
            text-decoration: none;
            color: #486581;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            padding: 10px 0;
            width: 80%;
            text-align: center;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }

        .menu a:hover {
            color: #0077e6;
            background-color: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* proste elementy admin */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin: 10px 0 15px;
        }

        .input, .select {
            padding: 12px 14px;
            border: 1px solid #dae1e7;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: white;
            color: #334e68;
            min-width: 200px;
        }

        .input:focus, .select:focus {
            border-color: #3fa9f5;
            box-shadow: 0 0 0 3px rgba(63,169,245,0.18);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid #dae1e7;
        }

        thead th {
            text-align: left;
            padding: 12px;
            background: #f8fafc;
            color: #334e68;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid #dae1e7;
        }

        tbody td {
            padding: 12px;
            border-bottom: 1px solid #dae1e7;
            font-size: 14px;
            color: #334e68;
            vertical-align: top;
        }

        tbody tr:last-child td { border-bottom: none; }

        .mini {
            padding: 8px 12px;
            font-size: 12px;
            border-radius: 10px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .danger {
            background: #ffeef0;
            color: #d64545;
            border: 1px solid #f7c5c5;
            box-shadow: none;
        }

        .tabs { display:flex; gap:10px; flex-wrap:wrap; margin: 5px 0 10px; }
        .tab {
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #dae1e7;
            background: #f8fafc;
            cursor: pointer;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.3px;
            color: #334e68;
        }
        .tab.active {
            border-color: #3fa9f5;
            box-shadow: 0 0 0 3px rgba(63,169,245,0.18);
            background: white;
            color: #102a43;
        }
        .hidden { display:none; }

        @media (max-width: 850px) {
            .container { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: auto; padding: 10px; flex-direction: row; justify-content: space-between; align-items: center; }
            .logo { width: 50px; height: 50px; margin: 0; }
            .logo span { font-size: 10px; }
            .menu { flex-direction: row; gap: 5px; width: auto; }
            .menu a { padding: 5px 10px; font-size: 12px; width: auto; }
            .main-content { border-radius: 0; padding: 20px; }
            .input, .select { min-width: 160px; }
        }
        /* ===== MODAL STYLE ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(16, 42, 67, 0.5); /* Lekko przyciemnione tło */
            backdrop-filter: blur(3px); /* Rozmycie tła pod spodem */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            transform: scale(0.95);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.open .modal {
            transform: scale(1);
        }

        .modal h3 {
            margin-bottom: 10px;
            font-size: 18px;
            color: #102a43;
        }

        .modal p {
            color: #486581;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-actions button {
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <main class="main-content">
        <h1>Panel administratora</h1>
        <div id="info" class="message"></div>

        <div class="tabs">
            <div id="tabProducts" class="tab active">Produkty</div>
            <div id="tabEmployees" class="tab">Pracownicy</div>
            <div id="tabHistory" class="tab">Historia</div>
            <button id="logoutBtn" class="btn secondary" style="margin-left:auto;">Wyloguj</button>
        </div>

        <section id="historySection" class="hidden">
            <h2>Dziennik zdarzeń</h2>
            <div class="toolbar">
                <button id="histReload" class="btn">Odśwież historię</button>
            </div>
            <div id="historyTable"></div>
        </section>

        <!-- ===== Produkty ===== -->
        <section id="productsSection">
            <h2>Produkty</h2>

            <div class="toolbar">
                <input id="prodSearch" class="input" placeholder="Szukaj (nazwa / typ)..." />
                <select id="prodSort" class="select">
                    <option value="name_asc">Sort: nazwa A→Z</option>
                    <option value="name_desc">Sort: nazwa Z→A</option>
                    <option value="qty_desc">Sort: ilość malejąco</option>
                    <option value="qty_asc">Sort: ilość rosnąco</option>
                    <option value="cost_desc">Sort: cena malejąco</option>
                    <option value="cost_asc">Sort: cena rosnąco</option>
                </select>
                <button id="prodReload" class="btn">Odśwież</button>
            </div>

            <h2>Dodaj produkt</h2>
            <div class="toolbar">
                <input id="pName" class="input" placeholder="Nazwa" />
                <input id="pType" class="input" placeholder="Typ" />
                <input id="pQty" class="input" placeholder="Ilość" type="number" min="0" />
                <input id="pCost" class="input" placeholder="Cena" type="number" min="0" step="0.01" />
                <select id="pAvail" class="select">
                    <option value="true">Dostępny</option>
                    <option value="false">Niedostępny</option>
                </select>
                <input id="pStockId" class="input" placeholder="stockId (liczba)" type="number" min="1" />
                <button id="prodAdd" class="btn">Dodaj</button>
            </div>

            <div id="productsTable"></div>
            <input type="file" id="globalFileInput" style="display: none;" accept="image/*">
        </section>

        <!-- ===== Pracownicy ===== -->
        <section id="employeesSection" class="hidden">
            <h2>Pracownicy</h2>

            <div class="toolbar">
                <input id="empSearch" class="input" placeholder="Szukaj (login / name / rola)..." />
                <select id="empSort" class="select">
                    <option value="login_asc">Sort: login A→Z</option>
                    <option value="login_desc">Sort: login Z→A</option>
                    <option value="role_asc">Sort: rola A→Z</option>
                    <option value="role_desc">Sort: rola Z→A</option>
                </select>
                <button id="empReload" class="btn">Odśwież</button>
            </div>

            <h2>Dodaj pracownika</h2>
            <div class="toolbar">
                <input id="eLogin" class="input" placeholder="Login" />
                <input id="ePass" class="input" placeholder="Hasło" type="password" />

                <input id="eName" class="input" placeholder="Imię i nazwisko (name)" />

                <select id="eRole" class="select">
                    <option value="ADMINISTRATOR">ADMINISTRATOR</option>
                    <option value="DOCTOR">DOCTOR</option>
                    <option value="NURSE">NURSE</option>
                    <option value="WAREHOUSE_WORKER">WAREHOUSE_WORKER</option>
                </select>

                <input id="eSalary" class="input" placeholder="Salary (np. 6500.00)" type="number" min="0" step="0.01" />
                <input id="eHospitalId" class="input" placeholder="hospitalId" type="number" min="1" />

                <label style="display:flex; align-items:center; gap:10px; padding: 0 6px;">
                    <input id="eActive" type="checkbox" checked />
                    Aktywny
                </label>

                <button id="empAdd" class="btn">Dodaj</button>
            </div>
            <div id="employeesTable"></div>
        </section>
    </main>

    <aside class="sidebar">
        <div class="logo">
            <img src="http://localhost:8080/images/logo.png"
                 alt="MediStock Admin"
                 style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <nav class="menu">
            <a id="goStocks">Magazyny</a>
            <a href="#">Pomoc</a>
            <a href="#">Kontakt</a>
            <a href="#">O systemie</a>
        </nav>
    </aside>
</div>
<div id="confirmModal" class="modal-overlay">
    <div class="modal">
        <h3 id="modalTitle">Potwierdzenie</h3>
        <p id="modalMessage">Czy na pewno chcesz wykonać tę akcję?</p>
        <div class="modal-actions">
            <button id="btnCancel" class="btn secondary">Anuluj</button>
            <button id="btnConfirm" class="btn danger">Usuń</button>
        </div>
    </div>
</div>

<div id="editModal" class="modal-overlay">
    <div class="modal" style="max-width: 450px; text-align: left;">
        <h3 id="editModalTitle">Edycja</h3>
        <div id="editFormContent" style="display: flex; flex-direction: column; gap: 15px; margin: 20px 0;">
        </div>
        <div class="modal-actions">
            <button onclick="closeEditModal()" class="btn secondary">Anuluj</button>
            <button id="saveEditBtn" class="btn">Zapisz zmiany</button>
        </div>
    </div>
</div>

<script>
    let currentUploadId = null;
    const BACKEND_URL = "http://localhost:8080";
    const token = localStorage.getItem("jwt_token");
    if (!token) window.location.href = "login.html";

    const role = String(localStorage.getItem("role") || localStorage.getItem("user_role") || "")
        .trim()
        .toUpperCase();

    if (!(role === "ADMIN" || role === "ADMINISTRATOR")) {
        window.location.href = "stockTEST.html";
    }

    function showMessage(text, type="normal") {
        const el = document.getElementById("info");
        el.textContent = text;
        if (type === "error") el.className = "message error";
        else if (type === "success") el.className = "message success";
        else el.className = "message";
        el.style.display = text ? "block" : "none";
    }

    async function api(path, options = {}) {
        const res = await fetch(`${BACKEND_URL}${path}`, {
            ...options,
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        });

        if (res.status === 401 || res.status === 403) {
            localStorage.clear();
            window.location.href = "login.html";
            return null;
        }
        return res;
    }

    // ===== Tabs
    const tabProducts = document.getElementById("tabProducts");
    const tabEmployees = document.getElementById("tabEmployees");
    const tabHistory = document.getElementById("tabHistory");

    const productsSection = document.getElementById("productsSection");
    const employeesSection = document.getElementById("employeesSection");
    const historySection = document.getElementById("historySection");


    function setTab(t) {
        const isProd = t === "prod";
        [tabProducts, tabEmployees, tabHistory].forEach(el => el.classList.remove("active"));
        [productsSection, employeesSection, historySection].forEach(el => el.classList.add("hidden"));
        if (t === "prod") {
            tabProducts.classList.add("active");
            productsSection.classList.remove("hidden");
        } else if (t === "emp") {
            tabEmployees.classList.add("active");
            employeesSection.classList.remove("hidden");
        } else if (t === "hist") {
            tabHistory.classList.add("active");
            historySection.classList.remove("hidden");
            loadHistory();
        }
    }
    tabProducts.onclick = () => setTab("prod");
    tabEmployees.onclick = () => setTab("emp");
    tabHistory.onclick = () => setTab("hist");

    async function loadHistory() {
        const wrap = document.getElementById("historyTable");
        wrap.innerHTML = '<p class="message" style="display:block">Ładowanie historii...</p>';

        try {
            const resProd = await api("/api/products/history/admin", { method: "GET" });
            const prodHistory = (resProd && resProd.ok) ? await resProd.json() : [];

            const resEmp = await api("/api/employees/admin/history", { method: "GET" });
            const empHistory = (resEmp && resEmp.ok) ? await resEmp.json() : [];

            const combined = [];

            prodHistory.forEach(item => {
                let descText = item.description;

                if (!descText) {
                    descText = item.adminAction
                        ? `Korekta stanu (ID: ${item.productId}) o: ${item.amount}`
                        : `Pobranie towaru (ID: ${item.productId}) ilość: ${item.amount}`;
                }

                combined.push({
                    date: item.timestamp,
                    type: "PRODUKT",
                    description: descText, // <-- Tutaj wstawiamy tekst z backendu
                    // Jeśli ilość jest różna od 0, pokazujemy ją w szczegółach
                    details: item.amount !== 0 ? `Ilość: ${item.amount > 0 ? '+' : ''}${item.amount}` : "Info",
                    color: item.adminAction ? "#e3f2fd" : "#f8fafc", // Niebieski dla admina, szary dla usera
                    textColor: "#102a43"
                });
            });

            // --- PRACOWNICY (BEZ ZMIAN) ---
            empHistory.forEach(item => {
                combined.push({
                    date: item.timestamp,
                    type: "PRACOWNIK",
                    description: item.description,
                    details: item.actionType,
                    color: "#fff3cd", // Żółty
                    textColor: "#856404"
                });
            });

            // 4. Sortowanie
            combined.sort((a, b) => new Date(b.date) - new Date(a.date));

            // 5. Renderowanie
            if (combined.length === 0) {
                wrap.innerHTML = `<p class="message" style="display:block">Brak wpisów w historii.</p>`;
                return;
            }

            wrap.innerHTML = `
              <table>
                <thead>
                  <tr>
                    <th>Data</th>
                    <th>Typ</th>
                    <th>Opis zdarzenia</th>
                    <th>Szczegóły</th>
                  </tr>
                </thead>
                <tbody>
                  ${combined.map(row => `
                    <tr>
                      <td>${new Date(row.date).toLocaleString()}</td>
                      <td>
                        <span class="mini" style="background:${row.color}; color:${row.textColor}; border: 1px solid rgba(0,0,0,0.05);">
                            ${row.type}
                        </span>
                      </td>
                      <td>${escapeHtml(row.description)}</td>
                      <td><strong>${escapeHtml(row.details)}</strong></td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            `;

        } catch (e) {
            console.error(e);
            wrap.innerHTML = `<p class="message error" style="display:block">Błąd ładowania historii.</p>`;
        }
    }

    document.getElementById("histReload").onclick = loadHistory;

    // ===== Logout / navigation
    document.getElementById("logoutBtn").onclick = () => { localStorage.clear(); window.location.href = "login.html"; };
    document.getElementById("goStocks").onclick = () => { window.location.href = "stockTEST.html"; };

    // =========================
    //  PRODUCTS
    // =========================
    let productsCache = [];

    const prodSearch = document.getElementById("prodSearch");
    const prodSort = document.getElementById("prodSort");

    function showConfirm(title, message) {
        return new Promise((resolve) => {
            const modalOverlay = document.getElementById('confirmModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const btnConfirm = document.getElementById('btnConfirm');
            const btnCancel = document.getElementById('btnCancel');

            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalOverlay.classList.add('open');

            const close = (result) => {
                modalOverlay.classList.remove('open');
                btnConfirm.replaceWith(btnConfirm.cloneNode(true));
                btnCancel.replaceWith(btnCancel.cloneNode(true));
                resolve(result);
            };
            document.getElementById('btnConfirm').onclick = () => close(true);
            document.getElementById('btnCancel').onclick = () => close(false);
        });
    }

    function productFilteredSorted() {
        const q = (prodSearch.value || "").trim().toLowerCase();
        let list = [...productsCache];

        if (q) {
            list = list.filter(p =>
                String(p.name || "").toLowerCase().includes(q) ||
                String(p.type || "").toLowerCase().includes(q)
            );
        }

        const s = prodSort.value;
        const byStr = (k, dir) => list.sort((a,b) => {
            const A = String(a[k] ?? "").toLowerCase();
            const B = String(b[k] ?? "").toLowerCase();
            return dir === "asc" ? A.localeCompare(B) : B.localeCompare(A);
        });
        const byNum = (k, dir) => list.sort((a,b) => (dir==="asc" ? (Number(a[k]||0)-Number(b[k]||0)) : (Number(b[k]||0)-Number(a[k]||0))));

        if (s==="name_asc") byStr("name","asc");
        if (s==="name_desc") byStr("name","desc");
        if (s==="qty_asc") byNum("quantity","asc");
        if (s==="qty_desc") byNum("quantity","desc");
        if (s==="cost_asc") byNum("cost","asc");
        if (s==="cost_desc") byNum("cost","desc");

        return list;
    }

    function renderProducts() {
        const wrap = document.getElementById("productsTable");
        const list = productFilteredSorted();
        if (!list.length) {
            wrap.innerHTML = `<p class="message" style="display:block">Brak produktów.</p>`;
            return;
        }
        wrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>ID</th><th>Nazwa</th><th>Typ</th><th>Ilość</th><th>Cena</th><th>Dostępny</th><th>Akcje</th>
              </tr>
            </thead>
            <tbody>
              ${list.map(p => `
                <tr>
                  <td>${p.id}</td>
                  <td>${escapeHtml(p.name)}</td>
                  <td>${escapeHtml(p.type)}</td>
                  <td>${Number(p.quantity||0)}</td>
                  <td>${Number(p.cost||0).toFixed(2)} PLN</td>
                  <td>${p.available ? "TAK" : "NIE"}</td>
                  <td>
                    <button class="btn mini secondary" onclick="openUpload(${p.id})" style="margin-right: 5px;">Foto</button>

                    <button class="btn mini"
                            style="background-color: #627d98; box-shadow: none; margin-right: 5px;"
                            onclick="openEditProduct(${p.id})">
                        Edytuj
                    </button>

                    <button class="btn mini danger" onclick="deleteProduct(${p.id})">Usuń</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
    }

    function openUpload(id) {
        currentUploadId = id;
        document.getElementById('globalFileInput').click();
    }

    document.getElementById('globalFileInput').addEventListener('change', async function() {
        if (this.files.length === 0 || !currentUploadId) return;

        const file = this.files[0];
        const formData = new FormData();
        formData.append("file", file);

        try {
            const res = await fetch(`${BACKEND_URL}/api/products/${currentUploadId}/image`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`
                },
                body: formData
            });
            if (res.ok) {
                showMessage("Zdjęcie dodane pomyślnie.", "success");
                await loadProducts();
            } else {
                showMessage("Błąd wysyłania zdjęcia.", "error");
            }
        } catch (err) {
            console.error(err);
            showMessage("Błąd połączenia.", "error");
        }
        this.value = "";
        currentUploadId = null;
    });

    async function loadProducts() {
        const res = await api("/api/products/all", { method: "GET" });
        if (!res) return;
        if (!res.ok) { showMessage("Nie udało się pobrać produktów.", "error"); return; }
        productsCache = await res.json();
        renderProducts();
    }

    async function addProduct() {
        const dto = {
            name: document.getElementById("pName").value.trim(),
            type: document.getElementById("pType").value.trim(),
            quantity: Number(document.getElementById("pQty").value || 0),
            cost: Number(document.getElementById("pCost").value || 0),
            available: document.getElementById("pAvail").value === "true",
            mediaUrl: null,
            stockId: Number(document.getElementById("pStockId").value || 0)
        };

        if (!dto.name || !dto.type || !dto.stockId) {
            showMessage("Uzupełnij: nazwa, typ, stockId.", "error");
            return;
        }

        const res = await api("/api/products/add", { method: "POST", body: JSON.stringify(dto) });
        if (!res) return;
        if (!res.ok) { showMessage("Nie udało się dodać produktu.", "error"); return; }

        showMessage("Dodano produkt.", "success");
        ["pName","pType","pQty","pCost","pStockId"].forEach(id => document.getElementById(id).value = "");
        await loadProducts();
    }

    window.deleteProduct = async function(id) {
        const confirmed = await showConfirm(
            "Usuwanie produktu",
            "Czy na pewno chcesz usunąć produkt ID " + id + "?"
        );
        if (!confirmed) return;
        const res = await api(`/api/products/admin/delete/${encodeURIComponent(id)}`, {
            method: "DELETE"
        });
        if (!res) return;
        if (!res.ok) {
            const txt = await res.text().catch(() => "");
            console.error("DELETE PRODUCT failed:", res.status, txt);
            showMessage("Nie udało się usunąć produktu.", "error");
            return;
        }
        showMessage("Usunięto produkt.", "success");
        await loadProducts();
    };


    document.getElementById("prodReload").onclick = loadProducts;
    document.getElementById("prodAdd").onclick = addProduct;
    prodSearch.oninput = renderProducts;
    prodSort.onchange = renderProducts;

    // =========================
    //  EMPLOYEES
    // =========================
    let employeesCache = [];
    const empSearch = document.getElementById("empSearch");
    const empSort = document.getElementById("empSort");

    function employeesFilteredSorted() {
        const q = (empSearch.value || "").trim().toLowerCase();
        let list = [...employeesCache];

        if (q) {
            list = list.filter(e =>
                String(e.login || "").toLowerCase().includes(q) ||
                String(e.name || "").toLowerCase().includes(q) ||
                String(e.role || "").toLowerCase().includes(q)
            );
        }

        const s = empSort.value;
        const byStr = (k, dir) => list.sort((a,b) => {
            const A = String(a[k] ?? "").toLowerCase();
            const B = String(b[k] ?? "").toLowerCase();
            return dir === "asc" ? A.localeCompare(B) : B.localeCompare(A);
        });

        if (s==="login_asc") byStr("login","asc");
        if (s==="login_desc") byStr("login","desc");
        if (s==="role_asc") byStr("role","asc");
        if (s==="role_desc") byStr("role","desc");

        return list;
    }

    function renderEmployees() {
        const wrap = document.getElementById("employeesTable");
        const list = employeesFilteredSorted();
        if (!list.length) {
            wrap.innerHTML = `<p class="message" style="display:block">Brak pracowników.</p>`;
            return;
        }
        wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Login</th>
            <th>Name</th>
            <th>Role</th>
            <th>Salary</th>
            <th>Hospital ID</th>
            <th>Active</th>
            <th>Akcje</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(e => `
            <tr>
              <td>${e.id}</td>
              <td>${escapeHtml(e.login || "")}</td>
              <td>${escapeHtml(e.name || "")}</td>
              <td>${escapeHtml(e.role || "")}</td>
              <td>${e.salary != null ? Number(e.salary).toFixed(2) : ""}</td>
              <td>${Number(e.hospitalId || 0)}</td>
              <td>${e.active ? "TAK" : "NIE"}</td>
              <td>
                <button class="btn mini" style="background-color: #627d98; box-shadow: none; margin-right: 5px;" onclick="openEditEmployee(${e.id})">Edytuj</button>

                <button class="btn mini danger" onclick="deleteEmployee(${e.id})">Usuń</button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
    }

    async function loadEmployees() {
        const res = await api("/api/employees", { method: "GET" });
        if (!res) return;
        if (!res.ok) { showMessage("Nie udało się pobrać pracowników.", "error"); return; }
        employeesCache = await res.json();
        renderEmployees();
    }

    async function addEmployee() {
        const employee = {
            login: document.getElementById("eLogin").value.trim(),
            name: document.getElementById("eName").value.trim(),
            role: document.getElementById("eRole").value,
            salary: (() => {
                const v = document.getElementById("eSalary").value;
                return v === "" ? null : Number(v);
            })(),
            hospitalId: Number(document.getElementById("eHospitalId").value || 0),
            active: document.getElementById("eActive").checked
        };
        const password = document.getElementById("ePass").value;
        if (!employee.login || !employee.name || !password || !employee.hospitalId) {
            showMessage("Uzupełnij: login, hasło, name, hospitalId.", "error");
            return;
        }
        if (!employee.role) {
            showMessage("Wybierz rolę.", "error");
            return;
        }
        const payload = { employee, password };
        const res = await api("/api/employees", { method: "POST", body: JSON.stringify(payload) });
        if (!res) return;
        if (!res.ok) {
            const txt = await res.text().catch(() => "");
            console.error("ADD EMPLOYEE failed:", res.status, txt);
            showMessage("Nie udało się dodać pracownika.", "error");
            return;
        }
        showMessage("Dodano pracownika.", "success");
        ["eLogin","ePass","eName","eSalary","eHospitalId"].forEach(id => document.getElementById(id).value = "");
        document.getElementById("eActive").checked = true;
        document.getElementById("eRole").value = "DOCTOR";
        await loadEmployees();
    }


    window.deleteEmployee = async function(id) {
        const confirmed = await showConfirm(
            "Usuwanie pracownika",
            "Czy na pewno chcesz usunąć pracownika ID " + id + "?"
        );
        if (!confirmed) return;
        const res = await api(`/api/employees/${encodeURIComponent(id)}`, { method: "DELETE" });
        if (!res) return;
        if (!res.ok) { showMessage("Nie udało się usunąć pracownika.", "error"); return; }
        showMessage("Usunięto pracownika.", "success");
        await loadEmployees();
    };

    document.getElementById("empReload").onclick = loadEmployees;
    document.getElementById("empAdd").onclick = addEmployee;
    empSearch.oninput = renderEmployees;
    empSort.onchange = renderEmployees;

    function escapeHtml(s) {
        return String(s)
            .replaceAll("&","&amp;")
            .replaceAll("<","&lt;")
            .replaceAll(">","&gt;")
            .replaceAll('"',"&quot;")
            .replaceAll("'","&#039;");
    }

    document.addEventListener("DOMContentLoaded", async () => {
        await loadProducts();
        await loadEmployees();
    });

    const editModal = document.getElementById('editModal');
    const editFormContent = document.getElementById('editFormContent');
    const editModalTitle = document.getElementById('editModalTitle');
    const saveEditBtn = document.getElementById('saveEditBtn');

    let currentEditId = null;
    let currentEditType = null; // 'PRODUCT' lub 'EMPLOYEE'

    window.closeEditModal = function() {
        editModal.classList.remove('open');
        currentEditId = null;
    }

    window.openEditEmployee = function(id) {
        const e = employeesCache.find(x => x.id === id);
        if (!e) return;

        currentEditId = id;
        currentEditType = 'EMPLOYEE';
        editModalTitle.textContent = `Edycja pracownika: ${e.login}`;

        editFormContent.innerHTML = `
            <label>Imię i nazwisko:
                <input id="ed_emp_name" class="input" style="width:100%" value="${escapeHtml(e.name)}">
            </label>
            <label>Login:
                <input id="ed_emp_login" class="input" style="width:100%" value="${escapeHtml(e.login)}">
            </label>
            <label>Rola:
                <select id="ed_emp_role" class="select" style="width:100%">
                    <option value="ADMINISTRATOR" ${e.role === 'ADMINISTRATOR' ? 'selected' : ''}>ADMINISTRATOR</option>
                    <option value="DOCTOR" ${e.role === 'DOCTOR' ? 'selected' : ''}>DOCTOR</option>
                    <option value="NURSE" ${e.role === 'NURSE' ? 'selected' : ''}>NURSE</option>
                    <option value="WAREHOUSE_WORKER" ${e.role === 'WAREHOUSE_WORKER' ? 'selected' : ''}>WAREHOUSE_WORKER</option>
                </select>
            </label>
            <label>Pensja:
                <input id="ed_emp_salary" type="number" step="0.01" class="input" style="width:100%" value="${e.salary || 0}">
            </label>
            <label style="display:flex; align-items:center; gap:10px; margin-top:5px; cursor:pointer;">
                <input id="ed_emp_active" type="checkbox" ${e.active ? 'checked' : ''}>
                Konto aktywne
            </label>
        `;
        editModal.classList.add('open');
    };

    window.openEditProduct = function(id) {
        const p = productsCache.find(x => x.id === id);
        if (!p) return;

        currentEditId = id;
        currentEditType = 'PRODUCT';
        editModalTitle.textContent = `Edycja produktu: ${p.name}`;

        editFormContent.innerHTML = `
            <label>Nazwa: <input id="ed_name" class="input" style="width:100%" value="${escapeHtml(p.name)}"></label>
            <label>Typ: <input id="ed_type" class="input" style="width:100%" value="${escapeHtml(p.type)}"></label>
            <div style="display:flex; gap:10px;">
                <label style="flex:1">Cena: <input id="ed_cost" type="number" step="0.01" class="input" style="width:100%" value="${p.cost}"></label>
                <label style="flex:1">Ilość: <input id="ed_qty" type="number" class="input" style="width:100%" value="${p.quantity}"></label>
            </div>
            <label>Dostępność:
                <select id="ed_avail" class="select" style="width:100%">
                    <option value="true" ${p.available ? 'selected' : ''}>Dostępny (TAK)</option>
                    <option value="false" ${!p.available ? 'selected' : ''}>Niedostępny (NIE)</option>
                </select>
            </label>
        `;
        editModal.classList.add('open');
    };

    saveEditBtn.onclick = async () => {
        if(!currentEditId) return;

        try {
            let url, body;

            if (currentEditType === 'EMPLOYEE') {
                url = `/api/employees/${currentEditId}`;
                const oldEmp = employeesCache.find(x => x.id === currentEditId);

                body = {
                    id: currentEditId,
                    hospitalId: oldEmp.hospitalId,
                    name: document.getElementById('ed_emp_name').value,
                    login: document.getElementById('ed_emp_login').value,
                    role: document.getElementById('ed_emp_role').value,
                    salary: Number(document.getElementById('ed_emp_salary').value),
                    active: document.getElementById('ed_emp_active').checked
                };
            }
            else if (currentEditType === 'PRODUCT') {
                url = `/api/products/${currentEditId}`;
                const oldProd = productsCache.find(x => x.id === currentEditId);

                body = {
                    id: currentEditId,
                    stockId: oldProd.stockId,
                    mediaUrl: oldProd.mediaUrl,
                    name: document.getElementById('ed_name').value,
                    type: document.getElementById('ed_type').value,
                    cost: Number(document.getElementById('ed_cost').value),
                    quantity: Number(document.getElementById('ed_qty').value),
                    available: document.getElementById('ed_avail').value === "true"
                };
            }

            const res = await api(url, {
                method: "PUT",
                body: JSON.stringify(body)
            });

            if (res && res.ok) {
                showMessage("Zaktualizowano pomyślnie.", "success");
                closeEditModal();
                if (currentEditType === 'PRODUCT') await loadProducts();
                else await loadEmployees();
            } else {
                showMessage("Błąd aktualizacji.", "error");
            }
        } catch (e) {
            console.error(e);
            showMessage("Błąd połączenia.", "error");
        }
    };
</script>
</body>
</html>
