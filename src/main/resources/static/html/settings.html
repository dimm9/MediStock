<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStock - Ustawienia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f7ff;
            color: #334e68;
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        .main-content {
            flex: 1;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
            z-index: 10;
            box-shadow: 10px 0 40px rgba(0, 119, 230, 0.08);
            border-top-right-radius: 30px;
            border-bottom-right-radius: 30px;
            gap: 20px;
        }

        .settings-box {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .settings-box h2 {
            font-size: 28px;
            color: #334e68;
        }

        .settings-box p, .settings-box ul {
            font-size: 16px;
            color: #555;
            line-height: 1.5;
        }

        .settings-box ul {
            padding-left: 20px;
        }

        .settings-box ul li {
            margin-bottom: 10px;
        }

        .sidebar {
            width: 200px;
            background: linear-gradient(160deg, #e3f2fd 0%, #bbdefb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 10px;
            position: relative;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: transparent;
            box-shadow: none;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            margin-top: 20px;
            transform: rotate(-5deg);
            transition: transform 0.5s ease;
        }

        .logo:hover { transform: rotate(0deg) scale(1.05); }

        .logo span {
            background: linear-gradient(135deg, #3fa9f5 0%, #0077e6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 16px;
            font-weight: 900;
            font-style: italic;
        }

        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .menu a {
            text-decoration: none;
            color: #486581;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            padding: 10px 0;
            width: 80%;
            text-align: center;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.3);
        }

        .menu a:hover {
            color: #0077e6;
            background-color: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        @media (max-width: 850px) {
            .container { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: auto; padding: 10px; flex-direction: row; justify-content: space-between; align-items: center;}
            .logo { width: 50px; height: 50px; margin: 0; }
            .logo span { font-size: 10px; }
            .menu { flex-direction: row; gap: 5px; width: auto; }
            .menu a { padding: 5px 10px; font-size: 12px; width: auto; }
            .main-content { border-radius: 0; padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <main class="main-content">
        <div class="settings-box">
            <h2>Ustawienia</h2>
            <p>Witamy w sekcji ustawień. Tutaj możesz dostosować swoje preferencje i zarządzać kontem.</p>
            <p>Opcje ustawień:</p>
            <ul>
                <li>Zmień hasło</li>
                <li>Zaktualizuj dane osobowe</li>
                <li>Ustawienia powiadomień</li>
            </ul>
        </div>
    </main>

    <aside class="sidebar">
        <div class="logo">
            <img src="http://localhost:8080/images/logo.png"
                 alt="MediStock Admin"
                 style="width: 100%; height: 100%; object-fit: contain;">
        </div>

        <nav class="menu" id="sidebarMenu">
            <!-- Menu items will be injected here -->
        </nav>
    </aside>
</div>

<script>
    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

    function renderSidebar() {
        const role = String(localStorage.getItem('role') || localStorage.getItem('user_role') || "").trim().toUpperCase();
        const menu = document.getElementById('sidebarMenu');
        menu.innerHTML = '';

        const isAdmin = (role === "ADMIN" || role === "ADMINISTRATOR");

        // Helper to create link
        const createLink = (href, text, isActive = false) => {
            const a = document.createElement('a');
            a.href = href;
            a.textContent = text;
            if (isActive) {
                a.style.backgroundColor = "rgba(255, 255, 255, 0.9)";
                a.style.color = "#0077e6";
                a.style.boxShadow = "0 4px 10px rgba(0,0,0,0.05)";
            }
            return a;
        };

        if (isAdmin) {
            menu.appendChild(createLink("admin.html", "Panel Admina"));
            menu.appendChild(createLink("depot.html", "Szpitale"));
        }

        menu.appendChild(createLink("stock.html", "Magazyn"));
        menu.appendChild(createLink("account.html", "Konto"));
        menu.appendChild(createLink("settings.html", "Ustawienia", true)); // Active

        const logoutLink = createLink("#", "Wyloguj");
        logoutLink.onclick = logout;
        menu.appendChild(logoutLink);
    }

    document.addEventListener("DOMContentLoaded", renderSidebar);
</script>

</body>
</html>
